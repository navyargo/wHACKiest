name: CI
on:
  push:
  pull_request:
jobs:
  test:
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu images.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carerelay
          POSTGRES_PASSWORD: carerelay
          POSTGRES_DB: carerelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carerelay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://carerelay:carerelay@localhost:5432/carerelay
      TEST_DATABASE_URL: postgresql://carerelay:carerelay@localhost:5432/carerelay_test
      DEMO_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: cp .env.example .env
      - run: PGPASSWORD=carerelay psql -h localhost -U carerelay -c "CREATE DATABASE carerelay_test;"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: test-results }
