services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carerelay
      POSTGRES_PASSWORD: carerelay
      POSTGRES_DB: carerelay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carerelay"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
